[project]
name = "psi4-parser"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "antlr4-python3-runtime==4.13.2",
    "click>=8.5.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
]

[project.scripts]
psi4-parser = "psi4_parser.cli:main"
psi4-sync = "psi4_parser.maintenance.sync:main"
psi4-check-corpus = "psi4_parser.maintenance.corpus:main"
psi4-regenerate = "psi4_parser.maintenance.generate:main"

[project.optional-dependencies]
openbabel = [
    "openbabel>=3.2.1",
]

[dependency-groups]
dev = [
    "antlr4-tools>=0.2.2",
    "jsonschema>=4.26.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "types-antlr4-python3-runtime>=4.13.0.20260807",
    "types-jsonschema>=4.26.0.20261006",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.mypy]
mypy_path = "typings"
plugins = ["pydantic.mypy"]
python_version = "3.15"
files = ["src/psi4_parser", "tests"]
exclude = ["/_generated/", "/_vendor/"]
strict = true
disallow_any_unimported = true
disallow_any_expr = true
disallow_any_decorated = true
disallow_any_explicit = true
disallow_any_generics = true
disallow_subclassing_any = true
strict_optional = true
strict_bytes = true
warn_unreachable = true
warn_unused_configs = true
strict_equality_for_none = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
    "truthy-iterable",
    "unused-awaitable",
    "explicit-override",
    "mutable-override",
    "exhaustive-match",
    "possibly-undefined",
]

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true
warn_required_dynamic_aliases = true

[tool.ruff]
target-version = "py315"
extend-exclude = ["src/psi4_parser/_generated", "src/psi4_parser/_vendor"]
line-length = 88

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "UP", "B", "A", "C4", "SIM", "PIE", "N", "ANN",
    "S", "DTZ", "T10", "T20", "PT", "RET", "ARG", "PTH", "ASYNC", "PERF",
    "FURB", "C90", "PL", "PGH", "RUF", "D", "TID",
    "DOC102", "DOC201", "DOC202", "DOC402", "DOC403", "DOC501", "DOC502",
]
# These checks conflict with the formatter. Google convention excludes D203.
ignore = ["E111", "E114", "E117", "W191", "D206", "D300"]
preview = true
explicit-preview-rules = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pydoclint]
ignore-one-line-docstrings = false

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# pytest needs assertions; literal expected results keep test cases readable.
"tests/**" = ["S101", "PLR2004"]
# Match the public names of Open Babel's existing SWIG binding API.
"typings/openbabel/*.pyi" = ["N802"]

[tool.ruff.format]
preview = false
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers", "--import-mode=importlib"]
